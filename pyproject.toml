[project]
name = "nexwave-mcp-remote"
version = "0.1.0"
description = "Try Day Club live Los Angeles car rentals — public rental tools and authenticated operator tools over streamable HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==4.0.3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
trydayclub-mcp = "nexwave_mcp.server:main"
nexwave-mcp = "nexwave_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexwave_mcp"]
