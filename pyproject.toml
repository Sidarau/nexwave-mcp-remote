[project]
name = "nexwave-mcp-remote"
version = "0.1.0"
description = "Remote MCP servers for the Sketchy Rides / Nexwave rental platform — renter plugin surface + operator ops, streamable HTTP on Fly.io (ZEUG-663)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
nexwave-mcp = "nexwave_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexwave_mcp"]
